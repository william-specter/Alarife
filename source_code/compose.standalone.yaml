# Self-contained Docker stack: no internet, no external Docker network, no shared services.
# Build the image online once, then transfer `alarife-app:dev` and `postgres:18-alpine`
# (see Documentation/13).
name: alarife-offline

x-app-environment: &app-environment
  APP_NAME: Alarife
  APP_ENV: local
  APP_DEBUG: 'true'
  APP_KEY: ${APP_KEY:-base64:JEINPGs3plvciGwnhYglcqx1XlsRAebvPsgvYNzx6y0=}
  APP_URL: http://localhost:8000
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_DATABASE: alarife
  DB_USERNAME: alarife
  DB_PASSWORD: alarife
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: log
  OCTANE_SERVER: frankenphp
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: '${REVERB_APP_ID:-774321}'
  REVERB_APP_KEY: '${REVERB_APP_KEY:-alarife-dev-key}'
  REVERB_APP_SECRET: '${REVERB_APP_SECRET:-alarife-dev-secret}'
  REVERB_HOST: reverb
  REVERB_PORT: '8080'
  REVERB_SCHEME: http

services:
  app:
    image: alarife-app:dev
    pull_policy: never
    build:
      context: .
    ports:
      - '8000:8000'
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: '1'
      RUN_SEED: ${RUN_SEED:-0}
    volumes:
      - media-data:/var/www/html/storage/app/public
      - private-data:/var/www/html/storage/app/private
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    image: alarife-app:dev
    pull_policy: never
    build:
      context: .
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - '8080:8080'
    environment:
      <<: *app-environment
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: '8080'
      RUN_MIGRATIONS: '0'
      RUN_SEED: '0'
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  queue:
    image: alarife-app:dev
    pull_policy: never
    build:
      context: .
    command: php artisan queue:work --queue=default,exports,media --tries=2 --timeout=900
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: '0'
      RUN_SEED: '0'
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - media-data:/var/www/html/storage/app/public
      - private-data:/var/www/html/storage/app/private
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: alarife
      POSTGRES_USER: alarife
      POSTGRES_PASSWORD: alarife
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alarife -d alarife']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
  private-data:
