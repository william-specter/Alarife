name: alarife

services:
  app:
    image: alarife-app:dev
    build:
      context: .
    ports:
      - '8000:8000'
    environment:
      APP_NAME: Alarife
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: ${APP_KEY:-base64:JEINPGs3plvciGwnhYglcqx1XlsRAebvPsgvYNzx6y0=}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: alarife
      DB_USERNAME: alarife
      DB_PASSWORD: ''
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_CLIENT: predis
      FILESYSTEM_DISK: public
      MAIL_MAILER: log
      RUN_MIGRATIONS: '1'
      RUN_SEED: ${RUN_SEED:-0}
    volumes:
      - media-data:/var/www/html/storage/app/public
      - private-data:/var/www/html/storage/app/private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  queue:
    image: alarife-app:dev
    build:
      context: .
    command: php artisan queue:work --queue=default,exports,media --tries=2 --timeout=900
    environment:
      APP_NAME: Alarife
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: ${APP_KEY:-base64:JEINPGs3plvciGwnhYglcqx1XlsRAebvPsgvYNzx6y0=}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: alarife
      DB_USERNAME: alarife
      DB_PASSWORD: ''
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_CLIENT: predis
      FILESYSTEM_DISK: public
      MAIL_MAILER: log
      RUN_MIGRATIONS: '0'
      RUN_SEED: '0'
    volumes:
      - media-data:/var/www/html/storage/app/public
      - private-data:/var/www/html/storage/app/private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: alarife
      POSTGRES_USER: alarife
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alarife -d alarife']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6381:6379'
    volumes:
      - redis-data:/data

  minio:
    profiles: ['object-storage']
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: alarife
      MINIO_ROOT_PASSWORD: alarife-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
  media-data:
  private-data:
